# Application racine (app-of-apps) — environnement PROD (AWS kubeadm). Voir docs/gitops.md.
# À appliquer UNE seule fois à la main : kubectl apply -f bootstrap/root-prod.yaml
# Ensuite tout passe par Git : un push sur la branche suivie suffit.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/KillianBelet/kube-infra
    # develop tant que les composants ne sont pas sur main ; passer à main ensuite.
    targetRevision: feature/app-of-apps
    path: apps
    directory:
      recurse: true
      # Seuls apps/common et apps/prod sont déployés ici.
      exclude: "local/*"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
