# Application métier : manifests du dossier deploy/ du repo applicatif, et ses secrets scellés
# (platform/kube-app, docs/registry.md).
# Wave 3 : déployée après l'infra (Traefik, certificats, Ingress).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-app
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://github.com/KillianBelet/kube-app
      targetRevision: HEAD
      path: deploy
      directory:
        recurse: true
    # imagePullSecret ghcr-pull (#38)
    - repoURL: https://github.com/KillianBelet/kube-infra
      targetRevision: develop
      path: platform/kube-app
  destination:
    server: https://kubernetes.default.svc
    namespace: app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
