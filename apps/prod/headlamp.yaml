# Headlamp (#50), prod AWS. Voir docs/headlamp.md.
# Wave 2 : après Traefik et les routes ; rien ne dépend de lui.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: headlamp
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://kubernetes-sigs.github.io/headlamp/
      chart: headlamp
      targetRevision: 0.46.0
      helm:
        releaseName: headlamp
        valueFiles:
          - $values/platform/headlamp/values.yaml
    - repoURL: https://github.com/KillianBelet/kube-infra
      targetRevision: develop
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: headlamp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
