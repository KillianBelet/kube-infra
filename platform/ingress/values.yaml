# Ingress HTTPS des services exposés (#32). Voir docs/ingress.md.
# Hostname = <nom de la route>.<baseDomain> ; certificat Let's Encrypt dans le Secret <nom>-tls.

# Prod : IP publique de kube-1 (base_domain dans ansible/inventory/group_vars/all/aws_outputs.yml).
# Local : values-local.yaml.
baseDomain: ""

# ClusterIssuer par défaut ; une route peut le surcharger (staging d'abord, puis prod).
issuer: letsencrypt-staging

# false en local : pas d'annotation cert-manager, Traefik sert son certificat par défaut.
certManager: true

ingressClassName: traefik

# Annotations ajoutées à toutes les Ingress.
annotations: {}

# Une entrée par service exposé. Le propriétaire du service passe enabled à true
# dans sa PR, une fois le Service déployé (le namespace doit exister).
routes:
  app:              # #55
    enabled: false
    namespace: app
    service: app
    port: 80
  argocd:           # #35 : argocd-server en HTTP (server.insecure), TLS terminé par Traefik
    enabled: false
    namespace: argocd
    service: argocd-server
    port: 80
  grafana:          # #47
    enabled: false
    namespace: monitoring
    service: kube-prometheus-stack-grafana
    port: 80
  headlamp:         # #50
    enabled: false
    namespace: headlamp
    service: headlamp
    port: 80
  dex:              # #41
    enabled: false
    namespace: dex
    service: dex
    port: 5556
  keycloak:         # #39
    enabled: false
    namespace: keycloak
    service: keycloak
    port: 80

# Champs optionnels d'une route :
#   issuer: letsencrypt-prod   # surcharge l'issuer par défaut
#   path: /                    # Prefix
#   annotations: {}            # annotations propres à cette Ingress
