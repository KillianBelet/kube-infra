# Keycloak (#39, #40)
# Chart : keycloakx 7.4.0 (https://codecentric.github.io/helm-charts), Keycloak 26.8.1
# Namespace : keycloak. Service : keycloak-http:80
# Voir docs/keycloak.md.

# Passé par apps/<env>/keycloak.yaml, même valeur que pour platform/ingress
baseDomain: ""

fullnameOverride: keycloak

image:
  repository: quay.io/keycloak/keycloak
  tag: "26.8.1"

# importe le realm au démarrage s'il n'existe pas encore
args:
  - start
  - --import-realm

replicas: 1

http:
  relativePath: "/"

# TLS terminé par Traefik, qui envoie des en-têtes X-Forwarded-*
proxy:
  enabled: true
  mode: xforwarded
  http:
    enabled: true

database:
  vendor: mysql
  hostname: keycloak-db
  port: 3306
  database: keycloak
  username: keycloak
  existingSecret: keycloak-db-credentials
  existingSecretKey: mysql-password

dbchecker:
  enabled: true

extraEnv: |
  - name: KC_HOSTNAME
    value: "https://keycloak.{{ required "baseDomain manquant (ex. 127.0.0.1.sslip.io)" .Values.baseDomain }}"
  # réseau des pods (pod_cidr) : seul Traefik peut fixer les X-Forwarded-*
  - name: KC_PROXY_TRUSTED_ADDRESSES
    value: "192.168.0.0/16"
  # utilisé dans realm-kube.json (redirect URI de dex)
  - name: REALM_BASE_DOMAIN
    value: "{{ .Values.baseDomain }}"

extraEnvFrom: |
  - secretRef:
      name: keycloak-admin
  - secretRef:
      name: keycloak-realm-secrets

extraVolumes: |
  - name: realm-import
    configMap:
      name: keycloak-realm
extraVolumeMounts: |
  - name: realm-import
    mountPath: /opt/keycloak/data/import
    readOnly: true

# seul label autorisé par la NetworkPolicy de keycloak-db
podLabels:
  keycloak-db-client: "true"

serviceAccount:
  automountServiceAccountToken: false

enableServiceLinks: false

podSecurityContext:
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsUser: 1000
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

# pas de limite CPU, sinon le démarrage est très lent
resources:
  requests:
    cpu: 100m
    memory: 768Mi
  limits:
    memory: 1Gi

# premier démarrage lent sur EFS (création du schéma) : 10 min max
startupProbe: |
  httpGet:
    path: '/health'
    port: '{{ .Values.http.internalPort }}'
    scheme: '{{ .Values.http.internalScheme }}'
  initialDelaySeconds: 15
  timeoutSeconds: 1
  failureThreshold: 120
  periodSeconds: 5

# exposé par la route keycloak de platform/ingress
ingress:
  enabled: false

metrics:
  enabled: true
