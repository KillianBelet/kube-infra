apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: keycloak

# avant le StatefulSet Keycloak
commonAnnotations:
  argocd.argoproj.io/sync-wave: "-1"

resources:
  - keycloak-admin.sealed.yaml
  - keycloak-realm-secrets.sealed.yaml

configMapGenerator:
  - name: keycloak-realm
    files:
      - realm-kube.json
    options:
      disableNameSuffixHash: true
