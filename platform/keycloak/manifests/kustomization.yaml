apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: keycloak

# avant le StatefulSet Keycloak
commonAnnotations:
  argocd.argoproj.io/sync-wave: "-1"

# Labels communs : docs/conventions.md (#80)
labels:
  - pairs:
      app.kubernetes.io/name: keycloak
      app.kubernetes.io/part-of: keycloak
      app.kubernetes.io/component: config

resources:
  - keycloak-admin.sealed.yaml
  - keycloak-realm-secrets.sealed.yaml

configMapGenerator:
  - name: keycloak-realm
    files:
      - realm-kube.json
    options:
      disableNameSuffixHash: true
