# Accepté : registre avec port et tag
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-ok-registry
  namespace: default
spec:
  selector:
    matchLabels: {app: test-ok-registry}
  template:
    metadata:
      labels: {app: test-ok-registry}
    spec:
      containers:
        - name: app
          image: registry.example.com:5000/team/app:1.4.2
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}
