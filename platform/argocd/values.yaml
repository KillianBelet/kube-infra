# Argo CD
# Chart : argo-cd (https://argoproj.github.io/argo-helm), version 10.18.0 (Argo CD v3.6.1)
# Namespace : argocd
# Voir docs/argocd.md pour l'installation, les dépôts et le test.
#
# Exposition : PAS d'Ingress dans ce chart. L'Ingress HTTPS d'Argo CD est la route `argocd`
# du chart platform/ingress (docs/ingress.md), comme pour tous les services.
#
# Valeurs par défaut = environnement local (kind). En prod, le rôle Ansible `argocd`
# surcharge `global.domain` avec argocd.<base_domain>.

global:
  # URL publique d'Argo CD (url du ConfigMap argocd-cm, SSO) : doit rester égale au
  # hostname de la route, soit argocd.<baseDomain> du chart platform/ingress.
  domain: argocd.127.0.0.1.sslip.io

configs:
  params:
    # TLS terminé par Traefik : le serveur Argo CD parle HTTP (Service argocd-server:80,
    # port attendu par la route `argocd` de platform/ingress).
    server.insecure: true

server:
  resources:
    requests:
      cpu: 25m
      memory: 128Mi

controller:
  resources:
    requests:
      cpu: 50m
      memory: 256Mi

repoServer:
  resources:
    requests:
      cpu: 25m
      memory: 128Mi

applicationSet:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi

redis:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi

# Pas de Dex : la connexion SSO passera directement par Keycloak (OIDC, ticket auth).
dex:
  enabled: false

# Pas de notifications pour l'instant.
notifications:
  enabled: false
