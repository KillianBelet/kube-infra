---
# Cluster de prod sur les 3 VM AWS (kubeadm).
#   ansible-playbook -i inventory site.yml
# Rejouable : un second passage ne change rien.

- name: Prérequis des nœuds (#2)
  hosts: all
  become: true
  roles: [common]

- name: Control plane sur kube-1 (#3)
  hosts: control_plane
  become: true
  roles: [control_plane]

- name: Workers kube-2 et kube-3 (#4)
  hosts: workers
  become: true
  roles: [worker]

- name: Réseau des pods (#5)
  hosts: control_plane
  become: true
  roles: [calico]
