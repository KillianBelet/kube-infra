# OIDC du cluster : dex est l'issuer unique (#41, docs/dex.md).
# Utilisé par kubectl-oidc.yml (#44). L'apiserver (#42) doit pointer sur le même issuer
# et le même client : control_plane_oidc_issuer_url / control_plane_oidc_client_id.
oidc_issuer_url: "https://dex.{{ base_domain }}"
oidc_client_id: kubernetes
oidc_scopes: [email, groups, profile]

