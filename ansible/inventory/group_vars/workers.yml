---
# Les workers n'ont pas d'IP publique fixe : on les joint sur leur IP privée
# en rebondissant par kube-1 (bastion).
ansible_host: "{{ private_ip }}"
ansible_ssh_common_args: >-
  -o ProxyCommand="ssh -i {{ ssh_key_path }} -o StrictHostKeyChecking=accept-new
  -W %h:%p {{ ansible_user }}@{{ public_ip }}"
