---
# Supprime TOUTE l'infrastructure AWS du projet (instances, disques, Elastic IP,
# EFS et ses données, IAM, réseau). Plus aucun coût ensuite.
# Recréer : ansible-playbook provision-aws.yml (nouvelle IP publique).
#
#   ansible-playbook destroy-aws.yml -e confirm=kube-12
- name: Détruire l'infrastructure AWS
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - inventory/group_vars/all/aws.yml
    - inventory/group_vars/all/ssh.yml
    - inventory/group_vars/all/cluster.yml
  module_defaults:
    group/amazon.aws.aws:
      region: "{{ aws_region }}"
    group/community.aws.aws:
      region: "{{ aws_region }}"

  tasks:
    - name: Confirmation
      ansible.builtin.assert:
        that: confirm | default('') == project
        fail_msg: "Destruction irréversible : relancer avec -e confirm={{ project }}"

    - name: Instances
      amazon.aws.ec2_instance:
        filters:
          "tag:Project": "{{ project }}"
          instance-state-name: [pending, running, stopping, stopped]
        state: absent
        wait: true

    - name: Elastic IPs du projet
      amazon.aws.ec2_eip_info:
        filters:
          "tag:Project": "{{ project }}"
      register: eips

    - name: Libérer les Elastic IPs
      amazon.aws.ec2_eip:
        public_ip: "{{ item.public_ip }}"
        state: absent
        release_on_disassociation: true
      loop: "{{ eips.addresses }}"
      loop_control:
        label: "{{ item.public_ip }}"

    - name: EFS (et ses mount targets)
      community.aws.efs:
        name: "{{ project }}-efs"
        state: absent
        wait: true

    - name: Clé SSH dans EC2
      amazon.aws.ec2_key:
        name: "{{ ssh_key_name }}"
        state: absent

    - name: Instance profile IAM
      amazon.aws.iam_instance_profile:
        name: "{{ project }}-node"
        state: absent

    - name: Rôle IAM
      amazon.aws.iam_role:
        name: "{{ project }}-node"
        state: absent

    - name: VPC du projet
      amazon.aws.ec2_vpc_net_info:
        filters:
          "tag:Name": "{{ project }}-vpc"
      register: vpcs

    - name: Réseau
      when: vpcs.vpcs | length > 0
      vars:
        vpc_id: "{{ vpcs.vpcs[0].vpc_id }}"
      block:
        - name: Security groups (EFS puis nœuds)
          amazon.aws.ec2_security_group:
            name: "{{ item }}"
            vpc_id: "{{ vpc_id }}"
            state: absent
          loop: ["{{ project }}-efs", "{{ project }}-nodes"]

        - name: Tables de routage du projet
          amazon.aws.ec2_vpc_route_table_info:
            filters:
              vpc-id: "{{ vpc_id }}"
              "tag:Project": "{{ project }}"
          register: rts

        - name: Supprimer les tables de routage
          amazon.aws.ec2_vpc_route_table:
            vpc_id: "{{ vpc_id }}"
            route_table_id: "{{ item.route_table_id }}"
            lookup: id
            state: absent
          loop: "{{ rts.route_tables }}"
          loop_control:
            label: "{{ item.route_table_id }}"

        - name: Subnet
          amazon.aws.ec2_vpc_subnet:
            vpc_id: "{{ vpc_id }}"
            cidr: "{{ subnet_cidr }}"
            state: absent

        - name: Internet gateway
          amazon.aws.ec2_vpc_igw:
            vpc_id: "{{ vpc_id }}"
            state: absent

        - name: VPC
          amazon.aws.ec2_vpc_net:
            vpc_id: "{{ vpc_id }}"
            state: absent

    - name: Fichiers générés obsolètes
      ansible.builtin.file:
        path: "{{ playbook_dir }}/{{ item }}"
        state: absent
      loop: [inventory/group_vars/all/aws_outputs.yml]

    - name: Empreintes SSH des nœuds supprimés
      ansible.builtin.file:
        path: "{{ ssh_known_hosts_file }}"
        state: absent
