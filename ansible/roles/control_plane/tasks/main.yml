---
- name: Configuration kubeadm
  ansible.builtin.template:
    src: kubeadm-config.yaml.j2
    dest: /etc/kubernetes/kubeadm-config.yaml
    mode: "0600"
  register: control_plane_kubeadm_config

- name: Cluster déjà initialisé ?
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: control_plane_admin_conf

- name: Lancer kubeadm init
  ansible.builtin.command: kubeadm init --config /etc/kubernetes/kubeadm-config.yaml
  when: not control_plane_admin_conf.stat.exists
  changed_when: true

# Config modifiée après l'init (ex. OIDC, #42) : on régénère le manifest de l'apiserver
- name: Mettre à jour le manifest de l'apiserver
  ansible.builtin.command: >-
    kubeadm init phase control-plane apiserver --config /etc/kubernetes/kubeadm-config.yaml
  when: control_plane_admin_conf.stat.exists and control_plane_kubeadm_config is changed
  changed_when: true

- name: Attendre l'apiserver
  ansible.builtin.command: kubectl --kubeconfig /etc/kubernetes/admin.conf get --raw /control_plane_readyz
  register: control_plane_readyz
  until: control_plane_readyz.rc == 0
  retries: 30
  delay: 5
  changed_when: false

# ---------- kubectl ----------
- name: Dossier .kube de {{ ansible_user }}
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/.kube"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0700"

- name: Copier le kubeconfig admin sur kube-1 pour {{ ansible_user }}
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: "/home/{{ ansible_user }}/.kube/config"
    remote_src: true
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"

- name: Lire le kubeconfig admin
  ansible.builtin.slurp:
    src: /etc/kubernetes/admin.conf
  register: control_plane_admin_kubeconfig

- name: Dossier local du kubeconfig
  ansible.builtin.file:
    path: "{{ control_plane_kubeconfig_local_path | dirname }}"
    state: directory
    mode: "0755" # même mode que dans local.yml
  delegate_to: localhost
  become: false

- name: Écrire le kubeconfig admin en local (IP publique)
  ansible.builtin.copy:
    dest: "{{ control_plane_kubeconfig_local_path }}"
    content: >-
      {{ control_plane_admin_kubeconfig.content | b64decode
         | regex_replace('server: https://.*:6443', 'server: https://' ~ public_ip ~ ':6443') }}
    mode: "0600"
  delegate_to: localhost
  become: false

# ---------- Jeton pour les workers (#26) ----------
- name: Commande de join (jeton valable 1 h)
  ansible.builtin.command: kubeadm token create --ttl 1h --print-join-command
  register: control_plane_join_cmd
  changed_when: false

- name: Mémoriser jeton et hash de la CA
  ansible.builtin.set_fact:
    control_plane_join_token: >-
      {{ control_plane_join_cmd.stdout | regex_search('--token (\S+)', '\1') | first }}
    control_plane_join_ca_hash: >-
      {{ control_plane_join_cmd.stdout | regex_search('--discovery-token-ca-cert-hash (\S+)', '\1') | first }}
