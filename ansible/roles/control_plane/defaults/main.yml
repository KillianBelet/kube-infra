---
# Authentification OIDC de l'apiserver (#42) : laisser vide tant que dex n'existe pas.
# Une fois renseigné, relancer site.yml : la config de l'apiserver est mise à jour.
control_plane_oidc_issuer_url: ""
control_plane_oidc_client_id: ""
control_plane_oidc_username_claim: email
control_plane_oidc_groups_claim: groups

# kubeconfig admin récupéré sur la machine qui lance Ansible (hors du repo)
control_plane_kubeconfig_local_path: "{{ lookup('ansible.builtin.env', 'HOME') }}/.kube-12/kubeconfig-aws"
