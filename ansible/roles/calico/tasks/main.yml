---
# Même manifest et même CIDR que l'environnement local (local.yml)
- name: Calico {{ calico_version }}
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf apply --server-side --force-conflicts
    -f {{ calico_manifest_url }}
  changed_when: false # apply idempotent

- name: Attendre que tous les nœuds soient Ready
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf wait --for=condition=Ready nodes --all --timeout=300s
  changed_when: false

- name: Nœuds
  ansible.builtin.command: kubectl --kubeconfig /etc/kubernetes/admin.conf get nodes -o wide -L {{ node_label_key }}
  register: calico_nodes_out
  changed_when: false

- name: Récapitulatif
  ansible.builtin.debug:
    var: calico_nodes_out.stdout_lines
