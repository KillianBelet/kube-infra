---
# Prérequis kubeadm sur les 3 nœuds : https://kubernetes.io/docs/setup/production-environment/tools/kubeadm/install-kubeadm/

- name: Nom d'hôte = nom du nœud (kube-1/2/3)
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Résolution des noms des nœuds
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '\s{{ item.name }}$'
    line: "{{ item.private_ip }} {{ item.name }}"
  loop: "{{ nodes }}"
  loop_control:
    label: "{{ item.name }}"

# ---------- Swap, modules, sysctl ----------
- name: Désactiver le swap
  ansible.builtin.command: swapoff -a
  when: ansible_facts.swaptotal_mb | int > 0
  changed_when: true

- name: Retirer le swap de fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*\sswap\s.*)$'
    replace: '# \1'

- name: Modules noyau chargés au démarrage
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter
    mode: "0644"

- name: Modules noyau chargés maintenant
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop: [overlay, br_netfilter]

- name: Paramètres réseau du noyau
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: "1"
    sysctl_file: /etc/sysctl.d/k8s.conf
    reload: true
  loop:
    - net.bridge.bridge-nf-call-iptables
    - net.bridge.bridge-nf-call-ip6tables
    - net.ipv4.ip_forward

# ---------- Dépôts APT ----------
- name: Paquets de base
  ansible.builtin.apt:
    name: [apt-transport-https, ca-certificates, curl, gpg, python3-debian]
    update_cache: true
    cache_valid_time: 3600

- name: Dépôt Docker (containerd 2.x)
  ansible.builtin.deb822_repository:
    name: docker
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_facts.distribution_release }}"
    components: stable
    signed_by: https://download.docker.com/linux/ubuntu/gpg
  register: common_repo_docker

- name: Dépôt Kubernetes v{{ kubernetes_version }}
  ansible.builtin.deb822_repository:
    name: kubernetes
    uris: "https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version }}/deb/"
    suites: /
    signed_by: "https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version }}/deb/Release.key"
  register: common_repo_k8s

- name: Mettre à jour l'index APT
  ansible.builtin.apt:
    update_cache: true
  when: common_repo_docker is changed or common_repo_k8s is changed

# ---------- containerd ----------
- name: Installer containerd
  ansible.builtin.apt:
    name: containerd.io
    state: present

- name: Configuration containerd présente
  ansible.builtin.stat:
    path: /etc/containerd/.kube12
  register: common_containerd_conf

# Le paquet containerd.io désactive le plugin CRI : on régénère la config par défaut.
- name: Configuration containerd par défaut
  ansible.builtin.shell: containerd config default > /etc/containerd/config.toml && touch /etc/containerd/.kube12
  when: not common_containerd_conf.stat.exists
  changed_when: true
  notify: Redémarrer containerd

- name: Containerd utilise le cgroup systemd (comme le kubelet)
  ansible.builtin.replace:
    path: /etc/containerd/config.toml
    regexp: 'SystemdCgroup = false'
    replace: 'SystemdCgroup = true'
  notify: Redémarrer containerd

- name: Configurer crictl vers containerd
  ansible.builtin.copy:
    dest: /etc/crictl.yaml
    content: |
      runtime-endpoint: unix:///run/containerd/containerd.sock
      image-endpoint: unix:///run/containerd/containerd.sock
    mode: "0644"

- name: Containerd démarré
  ansible.builtin.systemd_service:
    name: containerd
    state: started
    enabled: true

- name: Appliquer la config containerd avant kubeadm
  ansible.builtin.meta: flush_handlers

# ---------- kubeadm / kubelet / kubectl ----------
- name: Installer kubelet, kubeadm et kubectl {{ kubernetes_release }}
  ansible.builtin.apt:
    name: "{{ common_kubernetes_packages | product([common_kubernetes_package_version]) | map('join', '=') }}"
    state: present
    allow_change_held_packages: true

- name: Bloquer les paquets Kubernetes (apt upgrade ne les touche pas)
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: "{{ common_kubernetes_packages }}"

- name: Activer kubelet (il attend kubeadm init/join)
  ansible.builtin.systemd_service:
    name: kubelet
    enabled: true
